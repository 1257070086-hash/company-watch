name: Cloud RSS sync

on:
  # Cloudflare calls this dispatch endpoint every 20 minutes from
  # 08:12-23:52 Beijing
  # time. Repository administrators can also use it for manual recovery.
  # Do not add a GitHub schedule here: running both schedulers duplicates
  # supplier requests.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cloud-rss-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out collector
        uses: actions/checkout@v4
        with:
          path: site

      - name: Check out cloud data
        uses: actions/checkout@v4
        with:
          ref: cloud-data
          path: cloud-data

      - name: Fetch latest RSS entries
        env:
          RSS_SOURCES_JSON: ${{ secrets.RSS_SOURCES_JSON }}
        run: python3 site/scripts/cloud_rss_sync.py --output cloud-data/data-snapshot

      - name: Generate summaries for new full-text articles
        id: summaries
        continue-on-error: true
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python3 site/scripts/cloud_summarize.py --snapshot cloud-data/data-snapshot --max-items 20

      - name: Publish updated snapshot
        working-directory: cloud-data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data-snapshot
          if git diff --cached --quiet; then
            echo "No snapshot changes"
          else
            git commit -m "data: automatic RSS refresh"
            git push origin cloud-data
          fi

      - name: Report AI summary result
        if: always()
        env:
          SUMMARY_OUTCOME: ${{ steps.summaries.outcome }}
        run: |
          echo "RSS collection and AI summarization are separate stages." >> "$GITHUB_STEP_SUMMARY"
          echo "AI summary step: $SUMMARY_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          if [ -f cloud-data/data-snapshot/summary-meta.json ]; then
            cat cloud-data/data-snapshot/summary-meta.json >> "$GITHUB_STEP_SUMMARY"
          fi
          test "$SUMMARY_OUTCOME" = success
